
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#191919">
  <title>Japanese Flashcards</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Japanese Flashcards</h1>
      <p id="appStatus" role="status" aria-live="polite">
        Connecting to Supabase…
      </p>
    </header>

    <section id="authSection" aria-labelledby="authHeading" hidden>
      <h2 id="authHeading">Sign in</h2>
      <form id="signInForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password" required>

        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="studySection" hidden>
      <section id="streakSection" aria-labelledby="streakHeading">
        <h2 id="streakHeading">Study streaks</h2>
        <p>Current combo: <strong id="currentStreak">0</strong></p>
        <p>Highest combo: <strong id="highestStreak">0</strong></p>
      </section>

      <section id="flashcardSection" aria-labelledby="flashcardHeading">
        <h2 id="flashcardHeading">Flashcards</h2>
        <p id="cardCounter">Loading cards…</p>

        <article id="flashcard" class="flashcard">
          <div class="flashcard-inner">
            <div class="flashcard-front">
              <p id="cardKanji"></p>
              <p id="cardHiragana"></p>
              <p id="cardRomaji"></p>
              <p id="cardClass"></p>
            </div>

            <div class="flashcard-back">
              <p id="cardEnglish"></p>
              <p id="cardDefinition"></p>
            </div>
          </div>
        </article>

        <div class="card-controls">
          <button id="flipCardButton" type="button">Flip card</button>
          <button id="nextCardButton" type="button">Next card</button>
        </div>
      </section>

      <section id="blipSection" aria-labelledby="blipHeading">
        <h2 id="blipHeading">Daily blips</h2>
        <p id="blipCount">0 of 5 completed</p>

        <div id="blipDots" aria-label="Daily blip progress">
          <span class="blip-dot" data-blip="0"></span>
          <span class="blip-dot" data-blip="1"></span>
          <span class="blip-dot" data-blip="2"></span>
          <span class="blip-dot" data-blip="3"></span>
          <span class="blip-dot" data-blip="4"></span>
        </div>

        <div class="blip-controls">
          <button id="greenBlipButton" type="button">Green blip</button>
          <button id="redBlipButton" type="button">Red blip</button>
          <button id="resetBlipsButton" type="button">Reset today's blips</button>
        </div>

        <p id="blipStatus" role="status" aria-live="polite"></p>
      </section>

      <section id="historySection" aria-labelledby="historyHeading">
        <h2 id="historyHeading">Daily history</h2>
        <div id="dailyHistory"></div>
      </section>

      <button id="signOutButton" type="button">Sign out</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
