
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">JAPANESE STUDY</p>
        <h1>Flashcards</h1>
      </div>
      <button id="authButton" class="subtle-button">Sign in</button>
    </header>

    <section id="loginPanel" class="panel" hidden>
      <h2>Owner sign in</h2>
      <p>Sign in to add vocabulary to your collection.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username"
               required>
        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>
        <button type="submit" class="primary">Sign in</button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
    </section>

    <section class="study">
      <div class="card-count">
        <span>YOUR VOCABULARY</span>
        <span id="cardCount">Loading cards…</span>
      </div>

      <button id="flashcard" class="flashcard"
              aria-label="Flip flashcard" aria-pressed="false">
        <span class="card-face card-front">
          <span class="face-label">KANJI</span>
          <span id="kanji" class="kanji">日本語</span>
          <span class="hint">Click to reveal answer</span>
        </span>
        <span class="card-face card-back">
          <span class="face-label">READING & MEANING</span>
          <span id="hiragana" class="hiragana">にほんご</span>
          <span id="romaji" class="romaji">nihongo</span>
          <span class="answer-divider"></span>
          <span id="definition" class="definition">Japanese language</span>
          <span class="hint">Click to return to Kanji</span>
        </span>
      </button>

      <p id="status" class="message" role="status"
         aria-live="polite">Connecting to vocabulary database…</p>

      <button id="randomButton" class="primary full-width">
        ↻ &nbsp; Random Card
      </button>

      <button id="addButton" class="secondary full-width"
              hidden>＋ &nbsp; Add New Card</button>

      <section id="addPanel" class="panel" hidden>
        <h2>Add vocabulary</h2>
        <form id="addForm">
          <label for="newKanji">Kanji</label>
          <input id="newKanji" maxlength="100"
                 placeholder="猫" required>

          <label for="newHiragana">Hiragana</label>
          <input id="newHiragana" maxlength="100"
                 placeholder="ねこ" required>

          <label for="newRomaji">Romaji</label>
          <input id="newRomaji" maxlength="100"
                 placeholder="neko" required>

          <label for="newDefinition">Definition</label>
          <textarea id="newDefinition" maxlength="500"
                    placeholder="Cat" required></textarea>

          <button type="submit" class="primary full-width">
            Save Card
          </button>
          <button type="button" id="cancelAdd"
                  class="secondary full-width">Cancel</button>
        </form>
        <p id="saveMessage" class="message" role="status"></p>
      </section>

      <footer>
        <span id="accountStatus">Study mode</span>
        <span>Japanese vocabulary</span>
      </footer>
    </section>
  </main>
</body>
</html>
